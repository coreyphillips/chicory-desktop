name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - name: Use HTTPS for public Git dependencies
        run: |
          git config --global url."https://github.com/".insteadOf ssh://git@github.com/
          git config --global --add url."https://github.com/".insteadOf git@github.com:
      - run: npm ci
      - run: npm --prefix server ci
      - run: npm run runtime:prepare
      - run: npm run check
      # Electron's sandbox needs unprivileged user namespaces on Ubuntu 24.04.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: xvfb-run -a npm run test:gallery
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gallery
          path: artifacts/gallery
          if-no-files-found: ignore

  # Builds the app lock's Windows Hello helper and runs it on Windows. A runner
  # has no Windows Hello, so this covers the build, the argument checks and the
  # unavailable answer for a real window. The owned prompt needs real hardware.
  windows-hello:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - run: node scripts/desktop/build-windows-hello.mjs
      - run: node --test desktop/os-auth.test.cjs desktop/windows-hello.test.cjs

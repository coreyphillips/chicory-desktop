name: Package desktop apps
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: mac
            arch: arm64
          - os: macos-15-intel
            platform: mac
            arch: x64
          - os: ubuntu-24.04
            platform: linux
            arch: x64
          - os: windows-2025
            platform: win
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            build/runtime/package-lock.json
      - name: Use HTTPS for public Git dependencies
        run: |
          git config --global url."https://github.com/".insteadOf ssh://git@github.com/
          git config --global --add url."https://github.com/".insteadOf git@github.com:
      - run: npm ci
      - run: npm --prefix server ci --omit=dev
      - run: npm run runtime:prepare
      - run: npm run check
      - name: Package for the build host
        run: npx electron-builder --config build/electron-builder.yml --${{ matrix.platform }} --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Chicory-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
          if-no-files-found: error
          retention-days: 14

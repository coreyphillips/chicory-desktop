# Signed release builds, used by .github/workflows/release.yml and by
# npm run release:mac. Credentials come from the release environment's scoped
# secrets, or from the shell for a local macOS build (see docs/releases.md):
#   macOS: CSC_LINK, CSC_KEY_PASSWORD (Developer ID Application certificate),
#          APPLE_API_KEY, APPLE_API_KEY_ID, APPLE_API_ISSUER (notarization).
#   Windows: AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET for Azure
#          Trusted Signing. The account and profile names are passed on the
#          command line from repository variables.
extends: build/electron-builder.yml
artifactName: Chicory-${version}-${os}-${arch}.${ext}
extraMetadata:
  chicoryChannel: stable
forceCodeSigning: true
mac:
  # Matches the Developer ID Application certificate imported from CSC_LINK.
  # electron-builder rejects the name with its trailing colon, and the
  # development config's '-' would otherwise be inherited as an ad hoc identity.
  identity: Developer ID Application
  # Signs by that certificate's hash, because its name need not be unique.
  sign: build/sign-mac.cjs
  notarize: true

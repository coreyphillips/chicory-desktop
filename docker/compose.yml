services:
  manager:
    container_name: chicory-wallet_manager_1
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        BEIGNET_VERSION: "0.38.1"
    init: true
    restart: on-failure
    stop_grace_period: 1m
    ports:
      - "127.0.0.1:3000:3000"
      - "20101-20130:9101-9130"
    volumes:
      - chicory-data:/data
    environment:
      PORT: "3000"
      PUBLIC_PORT_BASE: "20101"
      TOR_PROXY_IP: chicory-wallet_tor_1
      TOR_PROXY_PORT: "9050"
      TOR_PASSWORD: beignetonionbrrr
    depends_on:
      - tor
  tor:
    container_name: chicory-wallet_tor_1
    image: ghcr.io/getumbrel/tor:0.4.9.11@sha256:e382b8629c0dfef6ceb396b062622d4e4e955b19d6f16b883fd2c0723ad5671a
    user: "1000:1000"
    restart: on-failure
    volumes:
      - ../store/chicory-wallet/torrc.template:/etc/tor/torrc:ro
      - chicory-tor:/data
    environment:
      HOME: /tmp
volumes:
  chicory-data:
  chicory-tor:
